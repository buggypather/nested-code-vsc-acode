name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm run package -w nested-code-vscode
      - run: npm run package -w nested-code-acode
      - uses: actions/upload-artifact@v4
        with:
          name: nested-code-installers
          path: |
            packages/vscode/*.vsix
            packages/acode/*.zip
