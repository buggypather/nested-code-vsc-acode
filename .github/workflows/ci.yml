name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests with diagnostic log
        shell: bash
        run: |
          set +e
          npm run build > test-output.txt 2>&1
          node --input-type=module >> test-output.txt 2>&1 <<'NODE'
          import { findEmbeddedRegions, findRecursiveEmbeddedRegions, findRecursiveBlockClose } from "./packages/core/dist/index.js";
          const source = [
            "const page = `",
            "<div>",
            "  <script>",
            "    const inner = `<span>\${name}</span>`;",
            "  </script>",
            "</div>`;"
          ].join("\n");
          console.log("CLOSE", source.indexOf("<script"), source.indexOf("</script>"), findRecursiveBlockClose(source, source.indexOf("<script>") + 8, source.length, "script"));\n          console.log("COMPILED_EMBEDDED", findEmbeddedRegions(source, "typescript").map(r => ({kind:r.kind,start:r.start,end:r.end,text:source.slice(r.start,r.end)})));
          console.log("COMPILED_RECURSIVE", findRecursiveEmbeddedRegions(source, "typescript").map(r => ({kind:r.kind,language:r.language,start:r.start,end:r.end,text:source.slice(r.start,r.end)})));
          NODE
          echo '--- EMITTED SCANNER ---' >> test-output.txt
          grep -A55 'function scanTemplateLiteralEnd' packages/core/dist/index.js >> test-output.txt
          npm test >> test-output.txt 2>&1
          status=$?
          cat test-output.txt
          exit $status
      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostic
          path: test-output.txt
      - run: npm run build
