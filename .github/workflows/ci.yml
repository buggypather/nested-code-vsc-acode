name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run tests with diagnostic log
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          exit $status
      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostic
          path: test-output.txt
      - run: npm run build
